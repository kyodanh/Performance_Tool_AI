name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a public release under this tag (leave empty to only upload artifacts)'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11
          cache: 'pnpm'

      # appdmg (DMG maker) builds native modules with node-gyp, which needs setuptools
      - name: install setuptools for appdmg
        if: runner.os == 'macOS'
        run: brew install python-setuptools

      - run: pnpm install --frozen-lockfile

      # .npmrc sets ignore-scripts, so the postinstall that fetches k6 never runs
      - run: node scripts/install-k6.js

      - run: pnpm make

      - uses: actions/upload-artifact@v4
        with:
          name: k6-studio-${{ matrix.platform }}
          path: out/make/**/*
          if-no-files-found: error

  # Artifacts need a GitHub login to download and expire after 90 days. A release
  # gives everyone a permanent public download link instead.
  release:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | xargs -0 gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" \
                --generate-notes
